<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes the page paint the whole screen,
         system bars included. Capacitor reads this exact token: without it
         it insets the WebView below the bars and the strips left over show
         the Android theme's own background, which follows the phone's
         light/dark setting rather than ours. Content is kept clear of the
         clock with the --safe-* variables (see index.css). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LD Move | Online Handstand, Mobility &amp; Calisthenics Coaching</title>
    <meta name="description" content="Online handstand, mobility and bodyweight strength coaching. Train smarter, get stronger and more mobile with structured programs that fit into real life.">
    <meta name="author" content="Maxime Ledieu · LD Move" />

    <!-- Open the TLS connection to Supabase while the JS still loads:
         saves a DNS+TLS round trip on the first API call of the app. -->
    <link rel="preconnect" href="https://sdgobbnlqquyzogrgqet.supabase.co" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ldmove.com" />
    <meta property="og:image" content="https://www.ldmove.com/og-image.png" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://www.ldmove.com/og-image.png" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <meta property="og:title" content="LD Move | Online Handstand, Mobility &amp; Calisthenics Coaching">
    <meta name="twitter:title" content="LD Move | Online Handstand, Mobility &amp; Calisthenics Coaching">
    <meta property="og:description" content="Online handstand, mobility and bodyweight strength coaching. Train smarter, get stronger and more mobile with structured programs that fit into real life.">
    <meta name="twitter:description" content="Online handstand, mobility and bodyweight strength coaching. Train smarter, get stronger and more mobile with structured programs that fit into real life.">
    <!-- Set the theme before the first paint.
         React only adds the class once it has mounted, which on the
         native shell is a second or more after the window appears: long
         enough to show a white screen and then swap it for a dark one,
         the exact flash the opening screen was built to avoid. This
         runs synchronously, so the app is already the right colour when
         the first pixel is drawn. Kept deliberately tiny and in sync
         with ThemeContext. -->
    <script>
      try {
        if (
          location.pathname.indexOf("/app") === 0 &&
          localStorage.getItem("ldmove-theme") === "dark"
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
